[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "analysis-gui"
version = "0.1.0"
description = "A visual interface for data analysis, starting with neural network visualization"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "Your Name", email = "your.email@example.com"}
]
dependencies = [
    "PyQt6>=6.0.0",
    "numpy>=1.20.0",
    "pandas>=1.1.0",
    "matplotlib>=3.3.0",
    "scikit-learn>=0.24.0",
    "tensorflow>=2.10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=6.0",
    "pytest-cov>=2.12",
    "black>=21.0",
    "flake8>=3.9",
    "mypy>=0.900",
]
models = [
    "anthropic>=0.7.0",
    "openai>=1.0.0",
]
claude = [
    "anthropic>=0.7.0",
]
gpt = [
    "openai>=1.0.0",
]
neural = [
    "mne>=1.0.0",
]
eeg = [
    "mne>=1.0.0",
]
spike = [
    "spikeinterface>=0.101.0",
]
s3 = [
    "boto3>=1.26.0",
]
gcs = [
    "google-cloud-storage>=2.10.0",
]

[project.scripts]
analysis-gui = "analysis_gui.main:main"
analysis-gui-cli = "analysis_gui.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages]
find = {where = ["src"]}

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
